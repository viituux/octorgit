[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "octorgit"
version = "0.7.0"
description = "Understand code. Generate knowledge. Evidence-first static Python analysis."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
octorgit = "octorgit.cli:main"
octorgit-web = "octorgit.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
octorgit = ["static/*.html", "static/*.css", "static/*.js", "static/*.json"]
